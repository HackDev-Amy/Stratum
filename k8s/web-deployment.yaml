
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-web
spec:
  replicas: 2
  selector:
    matchLabels: { app: trading-web }
  template:
    metadata:
      labels: { app: trading-web }
    spec:
      initContainers:
        - name: migrate
          image: your-registry/trading-platform:latest
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - secretRef: { name: trading-secrets }
            - configMapRef: { name: trading-config }
      containers:
        - name: web
          image: your-registry/trading-platform:latest
          command:
            - daphne
            - -b
            - 0.0.0.0
            - -p
            - "8000"
            - config.asgi:application
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef: { name: trading-secrets }
            - configMapRef: { name: trading-config }
          readinessProbe:
            httpGet: { path: /, port: 8000 }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 8000 }
            initialDelaySeconds: 30
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }